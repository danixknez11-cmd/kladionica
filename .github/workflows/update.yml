name: Osvezi Kladionicu
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preuzmi utakmice
        run: |
          cat << 'EOF' > skripta.py
          import urllib.request, urllib.error, json, re, datetime

          api_key = "8437677f0569d3de1c8fc29873bbcf86"
          lige = (
              "basketball_nba",
              "basketball_euroleague",
              "icehockey_nhl",
              "soccer_uefa_champs_league",
              "soccer_epl",
              "soccer_spain_la_liga",
              "soccer_italy_serie_a"
          )
          out = []
          greske = []
          count = 0
          now = datetime.datetime.now(datetime.timezone.utc)

          # 1. Povlacimo kvote za nadolazece utakmice
          for sport in lige:
              if count >= 15:
                  break
              try:
                  url_od = f"https://the-odds-api.com{sport}/odds/?apiKey={api_key}&regions=eu&markets=h2h"
                  req = urllib.request.urlopen(url_od, timeout=15)
                  matches = json.loads(req.read().decode("utf-8"))
                  for m in matches:
                      if count >= 15:
                          break
                      bms = m.get("bookmakers") or []
                      if not bms:
                          continue
                      ct_str = m.get("commence_time", "")
                      if not ct_str:
                          continue
                      ct = datetime.datetime.fromisoformat(ct_str.replace("Z", "+00:00"))
                      if ct <= now:
                          continue

                      outcomes = None
                      for bm in bms:
                          mkts = bm.get("markets") or []
                          if mkts:
                              outcomes = mkts.pop().get("outcomes")
                              if outcomes:
                                  break
                      if not outcomes:
                          continue

                      k1, kx, k2 = "0.00", "0.00", "0.00"
                      for o in outcomes:
                          cena = float(o.get("price", 0))
                          if o.get("name") == m.get("home_team"):
                              k1 = f"{cena:.2f}"
                          elif o.get("name") == m.get("away_team"):
                              k2 = f"{cena:.2f}"
                          else:
                              kx = f"{cena:.2f}"

                      home = re.sub(r"[^A-Za-z0-9 ]", "", m.get("home_team", ""))[:22]
                      away = re.sub(r"[^A-Za-z0-9 ]", "", m.get("away_team", ""))[:22]
                      mid = m.get("id", "")
                      out.append(f"MEC|{mid}|{home}|{away}|{k1}|{kx}|{k2}")
                      count += 1
              except urllib.error.HTTPError as e:
                  greske.append(f"HTTP_{e.code}_{sport}")
              except Exception as e:
                  greske.append(f"ERR_{sport}_{type(e).__name__}")

          # 2. Povlacimo rezultate zavrsenih utakmica u zadnja 3 dana
          for sport in lige:
              try:
                  url_sc = f"https://the-odds-api.com{sport}/scores/?apiKey={api_key}&daysFrom=3"
                  req = urllib.request.urlopen(url_sc, timeout=15)
                  scores = json.loads(req.read().decode("utf-8"))
                  for g in scores:
                      if g.get("completed") and g.get("scores"):
                          h, a = 0, 0
                          for s in g["scores"]:
                              if s.get("name") == g["home_team"]:
                                  h = int(s.get("score", 0))
                              if s.get("name") == g["away_team"]:
                                  a = int(s.get("score", 0))
                          ishod = 1 if h > a else (3 if a > h else 2)
                          gid = g.get("id", "")
                          out.append(f"REZ|{gid}|{ishod}")
              except Exception:
                  pass

          if not out:
              if greske:
                  out.append("GRESKA: " + ", ".join(greske))
              else:
                  out.append("NEMA_MECEVA_TRENUTNO")

          with open("kladionica.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          EOF
          python3 skripta.py
          rm skripta.py
      - name: Sacuvaj fajl
        run: |
          git config user.name "Bot"
          git config user.email "bot@github.com"
          git add kladionica.txt
          git commit -m "Update" || exit 0
          git push
